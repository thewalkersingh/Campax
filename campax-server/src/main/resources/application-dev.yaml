spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/campax_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false   # Disable for dev, let Hibernate auto-create for speed

server:
  port: 8080

logging:
  level:
    com.campax: DEBUG
    org.hibernate.SQL: DEBUG